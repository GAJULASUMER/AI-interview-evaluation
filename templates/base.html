<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview Evaluation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
<nav>
  <h2>AI Interview Evaluation</h2>
  <div>
    <a href="{{ url_for('resume.upload_resume') }}">Upload Resume</a>
    <a href="{{ url_for('interview.start_interview') }}">Interview</a>
    <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
  </div>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <p class="flash {{ category }}">{{ msg }}</p>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
